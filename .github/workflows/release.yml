name: release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: meta
        run: python .github/scripts/parse_release.py

      - id: check
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.meta.outputs.tag_name }}"
          
          # Commit auto-synced documents (CITATION.md, SECURITY.md) if changed
          if ! git diff-index --quiet HEAD -- CITATION.md SECURITY.md; then
            git add CITATION.md SECURITY.md
            git commit -m "docs: auto-sync version in documentation [skip ci]"
            git push origin main
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "${{ steps.meta.outputs.release_title }}"
            git push origin "$TAG"
          fi

      - if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: ${{ steps.meta.outputs.notes_path }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
